<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMResponder — Automate your Instagram DMs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; }
        .hero-gradient { background: radial-gradient(circle at top right, #f5f3ff 0%, #ffffff 50%); }
    </style>
</head>
<body class="antialiased">
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                    <i class="fas fa-bolt"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">DMResponder</span>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a href="#" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Features</a>
                <a href="#" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Pricing</a>
                <a href="#" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Testimonials</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="{% url 'login' %}" class="text-sm font-bold text-gray-900">Log in</a>
                <a href="{% url 'signup' %}" class="bg-indigo-600 text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 hero-gradient min-h-screen">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-center max-w-3xl mx-auto mb-20">
                <span class="inline-block px-4 py-1.5 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold tracking-widest uppercase mb-6">Built for Instagram Creators</span>
                <h1 class="text-6xl font-bold tracking-tight text-gray-900 mb-8 leading-[1.1]">Turn every comment into a <span class="text-indigo-600">customer.</span></h1>
                <p class="text-xl text-gray-500 mb-10 leading-relaxed">Automate your Instagram DMs, capture leads, and scale your sales with our visual drag-and-drop workflow builder.</p>
                <div class="flex items-center justify-center space-x-4">
                    <a href="{% url 'signup' %}" class="bg-indigo-600 text-white px-10 py-4 rounded-full font-bold hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100">Start Free Trial</a>
                    <a href="#" class="px-10 py-4 rounded-full font-bold text-gray-900 border border-gray-200 hover:bg-gray-50 transition-all">View Demo</a>
                </div>
            </div>

            <div class="relative max-w-5xl mx-auto">
                <div class="bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden p-2">
                    <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=1200&q=80" alt="Dashboard Preview" class="rounded-2xl w-full">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
